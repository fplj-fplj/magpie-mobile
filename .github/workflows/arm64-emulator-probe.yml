name: ARM64 Android emulator probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/arm64-emulator-probe.yml
      - scripts/probe-arm64-emulator.sh

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install official ARM64 Android system image
        run: |
          set -euo pipefail
          mkdir -p build-tmp/arm64-emulator-probe
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "system-images;android-30;default;arm64-v8a" 2>&1 | tee build-tmp/arm64-emulator-probe/sdk-install.log
      - name: Try actual ARM64 boot with software CPU emulation
        run: bash scripts/probe-arm64-emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-emulator-probe-${{ github.sha }}
          path: build-tmp/arm64-emulator-probe/
          if-no-files-found: error
