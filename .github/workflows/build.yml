name: Build signed APK (manual release)

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'core/**'
      - 'patches/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
      - '*.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish this verified signed APK as a GitHub Release
        required: true
        default: false
        type: boolean
      latest_mode:
        description: Latest behavior when publishing
        required: true
        default: auto
        type: choice
        options:
          - auto
          - latest
          - keep-current

concurrency:
  group: magpie-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check out the fixed upstream core
        uses: actions/checkout@v4
        with:
          repository: yetone/magpie
          ref: b52c711142a662fe18fedf5a80cb1e4aa94bce62
          path: build-tmp/upstream
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Identify Android compiler version
        id: ndk
        run: |
          ndk_root="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          test -n "$ndk_root"
          printf 'version=%s\n' "$(basename "$ndk_root")" >> "$GITHUB_OUTPUT"

      - name: Restore the exact Android ARM64 core
        id: core-cache
        uses: actions/cache@v4
        with:
          path: |
            build-tmp/magpie-mobile-android-arm64
            build-tmp/mobile-core.sha256
            build-tmp/mobile-core-build-info.txt
          key: ${{ runner.os }}-androidhost-arm64-go1.26.8-ndk${{ steps.ndk.outputs.version }}-b52c7111-${{ hashFiles('patches/mobile/**', 'scripts/apply-mobile-core.py', 'scripts/build-android-release-runtime.sh') }}

      - uses: actions/setup-go@v5
        if: steps.core-cache.outputs.cache-hit != 'true'
        with:
          go-version-file: build-tmp/upstream/go.mod
          cache-dependency-path: build-tmp/upstream/go.sum

      - name: Check actual startup manifest contract
        run: |
          python3 scripts/check-startup-contract.py
          python3 scripts/check-model-discovery-trigger.py
          python3 scripts/check-android-network-build.py
          python3 scripts/check-ui-assets.py
          python3 scripts/test_apk_signature.py
          python3 scripts/test_release_validation.py
          python3 scripts/test_release_publication.py
          python3 scripts/test_cleanup_releases.py
          python3 scripts/test-device-stability.py

      - name: Apply hash-pinned Android host adaptation
        run: |
          python3 scripts/test_apply_mobile_core.py
          python3 scripts/apply-mobile-core.py --source-root build-tmp/upstream --check
          python3 scripts/apply-mobile-core.py --source-root build-tmp/upstream

      - name: Restore verified Android Bun archive
        uses: actions/cache@v4
        with:
          path: build-tmp/bun.zip
          key: bun-android-arm64-1.4.2-a1c7e2983f1bb651

      - name: Fetch verified Bun runtime
        run: bash scripts/fetch-assets.sh --bun-only

      - name: Prepare the fixed Android ARM64 core
        env:
          MAGPIE_CORE_CACHE_HIT: ${{ steps.core-cache.outputs.cache-hit }}
        run: bash scripts/build-android-release-runtime.sh build-tmp/upstream

      - name: Restore fixed release signing key
        env:
          MAGPIE_SIGNING_KEY_B64: ${{ secrets.MAGPIE_SIGNING_KEY_B64 }}
          MAGPIE_SIGNING_PASSWORD: ${{ secrets.MAGPIE_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MAGPIE_SIGNING_KEY_B64" && test -n "$MAGPIE_SIGNING_PASSWORD"
          umask 077
          printf '%s' "$MAGPIE_SIGNING_KEY_B64" | base64 --decode > "${RUNNER_TEMP:?}/magpie-release.jks"

      - name: Build fixed-signed release APK
        env:
          MAGPIE_SIGNING_STORE: ${{ runner.temp }}/magpie-release.jks
          MAGPIE_SIGNING_PASSWORD: ${{ secrets.MAGPIE_SIGNING_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace --build-cache

      - name: Verify pinned APK signing certificate
        run: |
          set -euo pipefail
          python3 scripts/verify-apk-signature.py --apk app/build/outputs/apk/release/app-release.apk --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" | tee build-tmp/apk-signature.txt

      - name: Verify APK contains exactly the rebuilt core
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, struct, zipfile
          native = pathlib.Path('build-tmp/magpie-mobile-android-arm64').read_bytes()
          assert native[:4] == b'\x7fELF' and native[4] == 2
          assert struct.unpack_from('<H', native, 16)[0] == 3, 'expected ELF PIE'
          assert struct.unpack_from('<H', native, 18)[0] == 183, 'expected AArch64'
          with zipfile.ZipFile('app/build/outputs/apk/release/app-release.apk') as z:
              packaged = z.read('lib/arm64-v8a/libmagpie_exec.so')
          assert hashlib.sha256(packaged).digest() == hashlib.sha256(native).digest()
          print('PASS: packaged mobile core matches exact CI build', hashlib.sha256(native).hexdigest())
          PY

      - name: Probe production APK runtime payloads
        run: python3 scripts/runtimeprobe.py --apk app/build/outputs/apk/release/app-release.apk --abi arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload exported Room schema
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-${{ github.sha }}
          path: app/schemas/
          if-no-files-found: error

      - name: Upload signed release bundle
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            build-tmp/mobile-core.sha256
            build-tmp/mobile-core-build-info.txt
            build-tmp/apk-signature.txt
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    concurrency:
      group: magpie-release-publication
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Download the verified signed APK and evidence
        uses: actions/download-artifact@v4
        with:
          name: signed-release-${{ github.sha }}
          path: release-artifacts

      - name: Require successful Validation for this exact commit
        id: validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-release-validation.py

      - name: Publish the manually approved signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_URL: ${{ steps.validation.outputs.url }}
          VALIDATION_RUN_ID: ${{ steps.validation.outputs.run_id }}
          VALIDATION_ATTEMPT: ${{ steps.validation.outputs.attempt }}
          LATEST_MODE: ${{ inputs.latest_mode }}
        run: |
          set -euo pipefail
          version_name=$(grep -E 'versionName\s*=\s*' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          tag="v${version_name}-${GITHUB_SHA:0:8}"
          apk_name="magpie-mobile-${version_name}.apk"
          cp release-artifacts/app/build/outputs/apk/release/app-release.apk "$apk_name"
          sha256sum "$apk_name" | tee "${apk_name}.sha256"
          printf 'Commit: %s\nSource: b52c711142a662fe18fedf5a80cb1e4aa94bce62\nCore: 0.1.3781-androidhost.4 (nogui,androidhost; official plugins)\nActions run: %s/%s/actions/runs/%s\nPublication: manually approved via workflow_dispatch publish_release=true\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > build-info.txt
          printf 'Latest mode: %s\n' "$LATEST_MODE" >> build-info.txt
          cat release-artifacts/build-tmp/mobile-core.sha256 release-artifacts/build-tmp/apk-signature.txt >> build-info.txt
          printf 'Validation: %s\nValidation attempt: %s (regression and runtime-emulator completed successfully)\n' "$VALIDATION_URL" "$VALIDATION_ATTEMPT" >> build-info.txt
          notes_file="release-artifacts/release-notes.md"
          if [ -f "RELEASE_NOTES.md" ]; then
            awk 'BEGIN { section = 0 } /^## / { section++ } section == 1 { print } section == 2 { exit }' "RELEASE_NOTES.md" > "$notes_file"
          else
            printf 'Magpie-Mobile 自动化发布 %s\n提交：%s\n' "$version_name" "$GITHUB_SHA" > "$notes_file"
          fi
          printf '\n构建提交：`%s`\n\n签名与载荷校验通过；同提交最新 Validation 的 regression 与 runtime-emulator 均已完成并通过，发布由人工显式批准。\n\n[构建流程](%s/%s/actions/runs/%s) · [同提交验证结果（具体 attempt）](%s)\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$VALIDATION_URL" >> "$notes_file"
          latest_args=()
          case "$LATEST_MODE" in
            auto) ;;
            latest) latest_args+=(--make-latest) ;;
            keep-current) latest_args+=(--no-make-latest) ;;
            *) printf 'Unsupported latest_mode: %s\n' "$LATEST_MODE" >&2; exit 1 ;;
          esac
          python3 scripts/publish-verified-release.py --version "$version_name" --notes-file "$notes_file" \
            "${latest_args[@]}"
          printf '发布附件已核对 [%s](%s/%s/releases/tag/%s)\n' "$apk_name" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$tag" >> "$GITHUB_STEP_SUMMARY"
