name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: magpie-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check out the fixed upstream core
        uses: actions/checkout@v4
        with:
          repository: yetone/magpie
          ref: b52c711142a662fe18fedf5a80cb1e4aa94bce62
          path: build-tmp/upstream
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - uses: actions/setup-go@v5
        with:
          go-version-file: build-tmp/upstream/go.mod
          cache-dependency-path: build-tmp/upstream/go.sum

      - name: Check actual startup manifest contract
        run: |
          python3 scripts/check-startup-contract.py
          python3 scripts/check-model-discovery-trigger.py
          python3 scripts/check-android-network-build.py
          python3 scripts/check-ui-assets.py
          python3 scripts/test_apk_signature.py
          python3 scripts/test-device-stability.py

      - name: Apply hash-pinned Android host adaptation
        run: |
          python3 scripts/test_apply_mobile_core.py
          python3 scripts/apply-mobile-core.py --source-root build-tmp/upstream --check
          python3 scripts/apply-mobile-core.py --source-root build-tmp/upstream

      - name: Fetch verified Bun runtime
        run: bash scripts/fetch-assets.sh --bun-only

      - name: Run core and app JVM regression tests
        run: |
          set -euo pipefail
          gradle :core:test :app:testDebugUnitTest --no-daemon --stacktrace
          python3 scripts/check-room-schema.py

      - name: Upload JVM regression reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-reports-${{ github.sha }}
          path: |
            core/build/test-results/test/
            core/build/reports/tests/test/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/schemas/
          if-no-files-found: warn

      - name: Run actual mobile Go safety tests
        working-directory: build-tmp/upstream
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          go test -tags nogui ./internal/access -count=1 -timeout=3m
          go test -json -tags nogui,mobile ./internal/gateway ./internal/gui ./internal/cli ./internal/provider -run '^TestMobile' -count=1 -timeout=3m | tee ../mobile-go-tests.jsonl
          go test -json -tags nogui,androidhost ./internal/gateway ./internal/gui ./internal/cli ./internal/provider ./internal/plugin -run '^Test(AndroidHost|Mobile)' -count=1 -timeout=3m | tee ../androidhost-go-tests.jsonl

      - name: Host integration smoke with a synthetic upstream
        working-directory: build-tmp/upstream
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          go build -trimpath -tags nogui,mobile -ldflags '-s -w -X main.version=0.1.3781-mobile.1' -o ../magpie-mobile-host .
          python3 ../../scripts/smoke-mobile-core.py --exe ../magpie-mobile-host
          go build -trimpath -tags nogui,androidhost -ldflags '-s -w -X main.version=0.1.3781-androidhost.2' -o ../magpie-full-host .
          python3 ../../scripts/smoke-mobile-core.py --exe ../magpie-full-host --full-admin

      - name: Fetch hash-pinned Linux Bun for plugin integration
        run: bash scripts/fetch-host-bun.sh

      - name: Run real official plugin host integration
        run: |
          set -euo pipefail
          python3 scripts/smoke-official-plugins.py --exe build-tmp/magpie-full-host --bun build-tmp/bun-linux-host | tee build-tmp/official-plugin-smoke.txt

      - name: Run plugin host race regression
        working-directory: build-tmp/upstream
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          go test -race -tags nogui,androidhost ./internal/plugin ./internal/gui -run '^TestAndroidHost(Bridge|HostJS|PluginGateway|Imported|ImportFailure|OtherLocal)' -count=1 -timeout=3m | tee ../plugin-host-race.txt

      - name: Build the Android ARM64 full CLI core
        working-directory: build-tmp/upstream
        env:
          CGO_ENABLED: '1'
          GOOS: android
          GOARCH: arm64
        run: |
          set -euo pipefail
          # Android DNS uses Bionic/netd; CGO0 cannot use that resolver.
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          test -n "$ndk"
          export CC="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
          test -x "$CC"
          go build -trimpath -buildmode=pie -tags nogui,androidhost -ldflags '-s -w -X main.version=0.1.3781-androidhost.2 -linkmode=external -extldflags=-Wl,-z,max-page-size=16384' -o ../magpie-mobile-android-arm64 .
          cp ../magpie-mobile-android-arm64 ../../app/src/main/jniLibs/arm64-v8a/libmagpie_exec.so
          sha256sum ../magpie-mobile-android-arm64 > ../mobile-core.sha256
          go version -m ../magpie-mobile-android-arm64 > ../mobile-core-build-info.txt
          mkdir -p ../../app/src/main/assets/licenses/magpie
          cp LICENSE ../../app/src/main/assets/licenses/magpie/LICENSE.txt

      - name: Upload core safety evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-core-evidence-${{ github.sha }}
          path: |
            build-tmp/mobile-go-tests.jsonl
            build-tmp/androidhost-go-tests.jsonl
            build-tmp/mobile-core.sha256
            build-tmp/mobile-core-build-info.txt
            build-tmp/official-plugin-smoke.txt
            build-tmp/plugin-host-race.txt
          if-no-files-found: warn

      - name: Restore fixed release signing key
        env:
          MAGPIE_SIGNING_KEY_B64: ${{ secrets.MAGPIE_SIGNING_KEY_B64 }}
          MAGPIE_SIGNING_PASSWORD: ${{ secrets.MAGPIE_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MAGPIE_SIGNING_KEY_B64" && test -n "$MAGPIE_SIGNING_PASSWORD"
          umask 077
          printf '%s' "$MAGPIE_SIGNING_KEY_B64" | base64 --decode > "${RUNNER_TEMP:?}/magpie-release.jks"

      - name: Build fixed-signed release APK
        env:
          MAGPIE_SIGNING_STORE: ${{ runner.temp }}/magpie-release.jks
          MAGPIE_SIGNING_PASSWORD: ${{ secrets.MAGPIE_SIGNING_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify pinned APK signing certificate
        run: |
          set -euo pipefail
          python3 scripts/verify-apk-signature.py --apk app/build/outputs/apk/release/app-release.apk --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" | tee build-tmp/apk-signature.txt

      - name: Verify APK contains exactly the rebuilt core
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, struct, zipfile
          native = pathlib.Path('build-tmp/magpie-mobile-android-arm64').read_bytes()
          assert native[:4] == b'\x7fELF' and native[4] == 2
          assert struct.unpack_from('<H', native, 16)[0] == 3, 'expected ELF PIE'
          assert struct.unpack_from('<H', native, 18)[0] == 183, 'expected AArch64'
          with zipfile.ZipFile('app/build/outputs/apk/release/app-release.apk') as z:
              packaged = z.read('lib/arm64-v8a/libmagpie_exec.so')
          assert hashlib.sha256(packaged).digest() == hashlib.sha256(native).digest()
          print('PASS: packaged mobile core matches exact CI build', hashlib.sha256(native).hexdigest())
          PY

      - name: Probe production APK runtime payloads
        run: python3 scripts/runtimeprobe.py --apk app/build/outputs/apk/release/app-release.apk --abi arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: magpie-mobile-poc-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload signed release bundle
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            build-tmp/mobile-core.sha256
            build-tmp/mobile-core-build-info.txt
            build-tmp/apk-signature.txt
            build-tmp/official-plugin-smoke.txt
            build-tmp/plugin-host-race.txt
          if-no-files-found: error

  runtime-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yetone/magpie
          ref: b52c711142a662fe18fedf5a80cb1e4aa94bce62
          path: build-tmp/upstream
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: actions/setup-go@v5
        with:
          go-version-file: build-tmp/upstream/go.mod
          cache-dependency-path: build-tmp/upstream/go.sum
      - name: Build actual Android test payloads from fixed source
        run: |
          set -euo pipefail
          python3 scripts/apply-mobile-core.py --source-root build-tmp/upstream
          bash scripts/build-android-test-runtime.sh build-tmp/upstream
          gradle :app:assembleDebug :app:assembleDebugAndroidTest -PmagpieTestAbi=x86_64 --no-daemon --stacktrace
          python3 scripts/runtimeprobe.py --apk app/build/outputs/apk/debug/app-debug.apk --abi x86_64 | tee build-tmp/android-runtime-probe.txt
      - name: Enable KVM for Android emulator
        run: |
          sudo chmod 666 /dev/kvm
      - name: Run real Android Go and Bun plugin tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            trap 'mkdir -p build-tmp/android-plugin-runtime; adb pull /sdcard/Android/data/cc.fplj.magpiemobile/files/plugin-runtime build-tmp/android-plugin-runtime || true; adb logcat -d -s AndroidRuntime:E > build-tmp/android-plugin-runtime/android-errors.txt || true' EXIT
            adb shell settings put global hidden_api_policy 1
            gradle :app:connectedDebugAndroidTest -PmagpieTestAbi=x86_64 --no-daemon --stacktrace
      - name: Collect Android runtime screenshots and evidence
        if: always()
        run: |
          mkdir -p build-tmp/android-plugin-runtime
          if command -v adb >/dev/null; then
            adb pull /sdcard/Android/data/cc.fplj.magpiemobile/files/plugin-runtime build-tmp/android-plugin-runtime || true
            adb logcat -d -s AndroidRuntime:E > build-tmp/android-plugin-runtime/android-errors.txt || true
          fi
      - name: Upload actual Android runtime reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-plugin-runtime-${{ github.sha }}
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            build-tmp/android-plugin-runtime/
            build-tmp/android-runtime-probe.txt
            build-tmp/test-core-x86_64.sha256
            build-tmp/test-core-x86_64-build-info.txt
          if-no-files-found: warn

  publish:
    needs: [build, runtime-emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the verified signed APK and evidence
        uses: actions/download-artifact@v4
        with:
          name: signed-release-${{ github.sha }}
          path: release-artifacts

      - name: Publish tested candidate APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version_name=$(grep -E 'versionName\s*=\s*' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          tag="v${version_name}-${GITHUB_SHA:0:8}"
          apk_name="magpie-mobile-${version_name}.apk"
          cp release-artifacts/app/build/outputs/apk/release/app-release.apk "$apk_name"
          sha256sum "$apk_name" | tee "${apk_name}.sha256"
          printf 'Commit: %s\nSource: b52c711142a662fe18fedf5a80cb1e4aa94bce62\nCore: 0.1.3781-androidhost.2 (nogui,androidhost; official plugins)\nActions run: %s/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > build-info.txt
          cat release-artifacts/build-tmp/mobile-core.sha256 release-artifacts/build-tmp/apk-signature.txt >> build-info.txt
          printf 'Android runtime: x86_64 instrumentation; production ARM64 hardware verification pending.\n' >> build-info.txt
          notes_file="release-artifacts/release-notes.md"
          if [ -f "RELEASE_NOTES.md" ]; then
            cp "RELEASE_NOTES.md" "$notes_file"
          else
            printf 'Magpie-Mobile 自动化发布 %s\n提交：%s\n' "$version_name" "$GITHUB_SHA" > "$notes_file"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Magpie-Mobile ${version_name} (${GITHUB_SHA:0:8})" --notes-file "$notes_file" --target "$GITHUB_SHA" --prerelease
          else
            gh release edit "$tag" --title "Magpie-Mobile ${version_name} (${GITHUB_SHA:0:8})" --notes-file "$notes_file" --prerelease
          fi
          gh release upload "$tag" "$apk_name" "${apk_name}.sha256" build-info.txt release-artifacts/build-tmp/mobile-core-build-info.txt release-artifacts/build-tmp/official-plugin-smoke.txt --clobber
