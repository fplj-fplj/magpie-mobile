name: Validation

on:
  push:
    branches: [main, rikkahub-provider-layout]
    paths:
      - 'app/**'
      - 'core/**'
      - 'patches/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - '*.gradle.kts'
  workflow_dispatch:

concurrency:
  group: magpie-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Check out the fixed upstream core
        uses: actions/checkout@v4
        with:
          repository: yetone/magpie
          ref: b52c711142a662fe18fedf5a80cb1e4aa94bce62
          path: build-tmp/upstream
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - uses: actions/setup-go@v5
        with:
          go-version-file: build-tmp/upstream/go.mod
          cache-dependency-path: build-tmp/upstream/go.sum

      - name: Check actual startup manifest contract
        run: |
          python3 scripts/check-startup-contract.py
          python3 scripts/check-model-discovery-trigger.py
          python3 scripts/check-android-network-build.py
          python3 scripts/check-ui-assets.py
          python3 scripts/test_apk_signature.py
          python3 scripts/test_release_validation.py
          python3 scripts/test_release_publication.py
          python3 scripts/test-device-stability.py

      - name: Apply hash-pinned Android host adaptation
        run: |
          python3 scripts/test_apply_mobile_core.py
          python3 scripts/apply-mobile-core.py --source-root build-tmp/upstream --check
          python3 scripts/apply-mobile-core.py --source-root build-tmp/upstream

      - name: Run core and app JVM regression tests
        run: |
          set -euo pipefail
          gradle :core:test :app:testDebugUnitTest --no-daemon --stacktrace
          python3 scripts/check-room-schema.py

      - name: Upload JVM regression reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-reports-${{ github.sha }}
          path: |
            core/build/test-results/test/
            core/build/reports/tests/test/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/schemas/
          if-no-files-found: warn

      - name: Run actual mobile Go safety tests
        working-directory: build-tmp/upstream
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          go test -tags nogui ./internal/access -count=1 -timeout=3m
          go test -json -tags nogui,mobile ./internal/gateway ./internal/gui ./internal/cli ./internal/provider -run '^TestMobile' -count=1 -timeout=3m | tee ../mobile-go-tests.jsonl
          go test -json -tags nogui,androidhost ./internal/gateway ./internal/gui ./internal/cli ./internal/provider ./internal/plugin -run '^Test(AndroidHost|Mobile)' -count=1 -timeout=3m | tee ../androidhost-go-tests.jsonl

      - name: Host integration smoke with a synthetic upstream
        working-directory: build-tmp/upstream
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          go build -trimpath -tags nogui,mobile -ldflags '-s -w -X main.version=0.1.3781-mobile.1' -o ../magpie-mobile-host .
          python3 ../../scripts/smoke-mobile-core.py --exe ../magpie-mobile-host --evidence ../mobile-chat-profile.json
          go build -trimpath -tags nogui,androidhost -ldflags '-s -w -X main.version=0.1.3781-androidhost.2' -o ../magpie-full-host .
          python3 ../../scripts/smoke-mobile-core.py --exe ../magpie-full-host --full-admin --evidence ../androidhost-chat-profile.json

      - name: Verify real model directory TLS and pin boundaries
        run: |
          set -euo pipefail
          printf '\n127.0.0.1 catalog.magpie.test\n' | sudo tee -a /etc/hosts > /dev/null
          python3 scripts/smoke-model-discovery-tls.py --exe build-tmp/magpie-mobile-host --evidence build-tmp/mobile-discovery-tls.json
          python3 scripts/smoke-model-discovery-tls.py --exe build-tmp/magpie-full-host --evidence build-tmp/androidhost-discovery-tls.json

      - name: Fetch hash-pinned Linux Bun for plugin integration
        run: bash scripts/fetch-host-bun.sh

      - name: Run real official plugin host integration
        run: |
          set -euo pipefail
          python3 scripts/smoke-official-plugins.py --exe build-tmp/magpie-full-host --bun build-tmp/bun-linux-host | tee build-tmp/official-plugin-smoke.txt

      - name: Run plugin host race regression
        working-directory: build-tmp/upstream
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          go test -race -tags nogui,androidhost ./internal/plugin ./internal/gui -run '^TestAndroidHost(Bridge|HostJS|PluginGateway|Imported|ImportFailure|OtherLocal)' -count=1 -timeout=3m | tee ../plugin-host-race.txt

      - name: Upload core regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-regression-${{ github.sha }}
          path: |
            build-tmp/mobile-go-tests.jsonl
            build-tmp/androidhost-go-tests.jsonl
            build-tmp/official-plugin-smoke.txt
            build-tmp/plugin-host-race.txt
            build-tmp/mobile-discovery-tls.json
            build-tmp/androidhost-discovery-tls.json
            build-tmp/mobile-chat-profile.json
            build-tmp/androidhost-chat-profile.json
          if-no-files-found: warn

  runtime-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yetone/magpie
          ref: b52c711142a662fe18fedf5a80cb1e4aa94bce62
          path: build-tmp/upstream
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Identify Android compiler version
        id: ndk
        run: |
          ndk_root="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          test -n "$ndk_root"
          printf 'version=%s\n' "$(basename "$ndk_root")" >> "$GITHUB_OUTPUT"

      - name: Restore exact Android test payloads
        id: test-core-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build-tmp/magpie-mobile-android-x86_64
            build-tmp/test-core-x86_64.sha256
            build-tmp/test-core-x86_64-build-info.txt
            build-tmp/bun-x86_64.zip
          key: ${{ runner.os }}-androidhost-x86_64-go1.26.8-ndk${{ steps.ndk.outputs.version }}-b52c7111-${{ hashFiles('patches/mobile/**', 'scripts/apply-mobile-core.py', 'scripts/build-android-test-runtime.sh') }}

      - uses: actions/setup-go@v5
        if: steps.test-core-cache.outputs.cache-hit != 'true'
        with:
          go-version-file: build-tmp/upstream/go.mod
          cache-dependency-path: build-tmp/upstream/go.sum
      - name: Prepare Android test payloads
        env:
          MAGPIE_TEST_CORE_CACHE_HIT: ${{ steps.test-core-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          python3 scripts/apply-mobile-core.py --source-root build-tmp/upstream
          bash scripts/build-android-test-runtime.sh build-tmp/upstream
      - name: Save verified Android test payloads
        if: steps.test-core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build-tmp/magpie-mobile-android-x86_64
            build-tmp/test-core-x86_64.sha256
            build-tmp/test-core-x86_64-build-info.txt
            build-tmp/bun-x86_64.zip
          key: ${{ steps.test-core-cache.outputs.cache-primary-key }}

      - name: Build and inspect the Android test APK
        run: |
          set -euo pipefail
          gradle :app:assembleDebug :app:assembleDebugAndroidTest -PmagpieTestAbi=x86_64 --no-daemon --stacktrace --build-cache
          python3 scripts/runtimeprobe.py --apk app/build/outputs/apk/debug/app-debug.apk --abi x86_64 | tee build-tmp/android-runtime-probe.txt
      - name: Enable KVM for Android emulator
        run: |
          sudo chmod 666 /dev/kvm
      - name: Run real Android Go and Bun plugin tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run-android-plugin-tests.sh
      - name: Upload actual Android runtime reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-plugin-runtime-${{ github.sha }}
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            build-tmp/android-plugin-runtime/
            build-tmp/android-runtime-probe.txt
            build-tmp/test-core-x86_64.sha256
            build-tmp/test-core-x86_64-build-info.txt
          if-no-files-found: warn

  runtime-arm64-capabilities:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Inspect actual ARM64 runner virtualization support
        run: |
          python3 - <<'PY'
          import fcntl, json, os, platform
          result = {'hostMachine': platform.machine(), 'kvmDevice': os.path.exists('/dev/kvm'),
                    'kvmReadableWritable': os.access('/dev/kvm', os.R_OK | os.W_OK),
                    'androidRuntimeVerified': False}
          if result['kvmDevice']:
              try:
                  with open('/dev/kvm', 'rb', buffering=0) as device:
                      result['kvmApiVersion'] = fcntl.ioctl(device.fileno(), 0xAE00)
              except Exception as error:
                  result['kvmErrorType'] = type(error).__name__
          with open('arm64-runner-capabilities.json', 'w') as output:
              json.dump(result, output, indent=2)
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arm64-runner-capabilities-${{ github.sha }}
          path: arm64-runner-capabilities.json
          if-no-files-found: error

